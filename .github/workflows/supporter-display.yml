name: Supporter collectible display
on:
  push:
    paths: ['js/**', 'vendor/**', 'decent-head.config.js', 'index.html', 'css/**', 'test/supporter-*', 'test/market-*', 'supporter.html', 'releases/**', 'package*.json', '.github/workflows/supporter-display.yml']
  pull_request:
    paths: ['js/**', 'vendor/**', 'decent-head.config.js', 'index.html', 'css/**', 'test/supporter-*', 'test/market-*', 'supporter.html', 'releases/**', 'package*.json', '.github/workflows/supporter-display.yml']
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:supporter
      - run: npm run test:market-adoption
      - run: node --check js/supporter-studio.mjs
  studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Rehearse prepared release without real signatures
        env:
          BASE_URL: http://127.0.0.1:8792
        run: |
          python3 -m http.server 8792 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null "$BASE_URL/supporter.html"; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null "$BASE_URL/supporter.html"
          npm run test:supporter:browser
          npm run test:supporter:embedded
          npm run test:market-adoption:browser
